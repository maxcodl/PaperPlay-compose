name: Build PaperPlay

# Every push builds the Android debug and release APKs and the Windows and Linux apps. A push to beta also publishes a
# numbered pre-release, a push to main publishes the stable release; the version and the change log come from the commit
# subjects (scripts/release/release.py). The tests are switched off because a test in :core:jvmTest hangs on the runner.
on:
  push:
    branches: [ main, beta ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force the version bump instead of reading the commit subjects'
        type: choice
        options: [ auto, patch, minor, major ]
        default: auto

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      base: ${{ steps.plan.outputs.base }}
      code: ${{ steps.plan.outputs.code }}
      channel: ${{ steps.plan.outputs.channel }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history and every tag

      - name: Release script tests
        run: python3 scripts/release/test_release.py

      - name: Work out the version
        id: plan
        run: |
          channel=beta
          if [ "${GITHUB_REF_NAME}" = "main" ]; then channel=stable; fi
          python3 scripts/release/release.py plan --channel "$channel" --bump "${{ inputs.bump || 'auto' }}" --github-output

  android:
    name: Android (${{ matrix.type }} APK)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { type: debug, task: assembleDebug }
          - { type: release, task: assembleRelease }
    env:
      # Optional repository secrets for signing. Without them the release APK is signed with the debug key.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        if: env.ANDROID_HOME != ''
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          fi

      - name: Set up signing key (only when the secrets exist)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "keystore.path=$RUNNER_TEMP/release.keystore"
            echo "keystore.password=$KEYSTORE_PASSWORD"
            echo "key.alias=$KEY_ALIAS"
            echo "key.password=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"
          echo "signing.file=$RUNNER_TEMP/signing.properties" >> local.properties

      - name: Build Android ${{ matrix.type }} APK
        run: ./gradlew :androidApp:${{ matrix.task }} -PappVersion=${{ needs.version.outputs.version }} -PappVersionCode=${{ needs.version.outputs.code }} --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/${{ matrix.type }}/*.apk dist/PaperPlay-${{ needs.version.outputs.version }}-android-${{ matrix.type }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PaperPlay-Android-${{ matrix.type }}
          path: dist/*.apk
          if-no-files-found: error

  desktop-windows:
    name: Desktop (Windows zip and setup exe)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # libvlc and TDLib are not in the repository. libvlc comes from the official VLC zip.
      # TDLib comes from a release named "deps" in this repository (asset tdlib-windows.zip holding
      # tdjson.dll and its DLLs). Without it the app still builds but cannot reach Telegram.
      - name: Get libvlc
        shell: pwsh
        run: |
          $v = '3.0.21'
          $zip = "$env:RUNNER_TEMP\vlc.zip"
          curl.exe --fail --location --retry 3 --silent --show-error -o $zip "https://download.videolan.org/pub/videolan/vlc/$v/win64/vlc-$v-win64.zip"
          if ($LASTEXITCODE -ne 0) { throw "VLC download failed (curl exit code $LASTEXITCODE)" }
          "VLC zip: {0:N1} MB" -f ((Get-Item $zip).Length / 1MB)
          7z x $zip "-o$env:RUNNER_TEMP\vlc" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "VLC unzip failed (7z exit code $LASTEXITCODE)" }
          $src = Get-ChildItem "$env:RUNNER_TEMP\vlc" -Directory | Select-Object -First 1
          $dst = "desktopApp\src\jvmMain\resources\vlc\windows"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$($src.FullName)\libvlc.dll", "$($src.FullName)\libvlccore.dll" $dst
          Copy-Item "$($src.FullName)\plugins" "$dst\plugins" -Recurse
          "PAPERPLAY_VLC=$($src.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Get TDLib for Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download deps --repo "${{ github.repository }}" --pattern "tdlib-windows.zip" --dir "$env:RUNNER_TEMP" 2>$null
          $global:LASTEXITCODE = 0 # a missing release is expected; the step must not inherit gh's exit code
          if (Test-Path "$env:RUNNER_TEMP\tdlib-windows.zip") {
            Expand-Archive "$env:RUNNER_TEMP\tdlib-windows.zip" -DestinationPath "$env:RUNNER_TEMP\tdlib" -Force
            "PAPERPLAY_TDLIB=$env:RUNNER_TEMP\tdlib" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Warning "No 'deps' release with tdlib-windows.zip: the Windows build will not include TDLib."
          }

      - name: Build release app image
        shell: cmd
        # Same build as scripts/release.ps1: the minified release image, then the Inno Setup installer.
        run: gradlew.bat :desktopApp:createReleaseDistributable -PappVersion=${{ needs.version.outputs.version }} -PappVersionCode=${{ needs.version.outputs.code }} --no-daemon

      - name: Build setup exe and zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = "${{ needs.version.outputs.version }}"
          $app = (Resolve-Path "desktopApp\build\compose\binaries\main-release\app\PaperPlay").Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$($v -replace '-.*$','')" "/DAppDir=$app" "/DOutDir=$PWD\dist" "/FPaperPlay-$v-windows-x64-setup" desktopApp\installer\PaperPlay.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Compress-Archive -Path $app -DestinationPath "dist\PaperPlay-$v-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PaperPlay-Windows
          path: dist/*
          if-no-files-found: error

  desktop-linux:
    name: Desktop (Linux archive)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build desktop distribution
        run: ./gradlew :desktopApp:createDistributable -PappVersion=${{ needs.version.outputs.version }} -PappVersionCode=${{ needs.version.outputs.code }} --no-daemon

      - name: Package Linux archive
        run: |
          mkdir -p dist
          tar -czf dist/PaperPlay-${{ needs.version.outputs.version }}-linux-x64.tar.gz -C desktopApp/build/compose/binaries/main/app .

      - uses: actions/upload-artifact@v4
        with:
          name: PaperPlay-Linux
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [ version, android, desktop-windows, desktop-linux ]
    if: needs.version.outputs.release == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Release notes and checksums
        run: |
          rm -f release-files/*-android-debug.apk # the debug APK stays a workflow artifact
          python3 scripts/release/release.py notes --channel "${{ needs.version.outputs.channel }}" --out notes.md
          (cd release-files && sha256sum * > SHA256SUMS.txt)

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PaperPlay ${{ needs.version.outputs.version }}
          body_path: notes.md
          prerelease: ${{ needs.version.outputs.channel == 'beta' }}
          make_latest: ${{ needs.version.outputs.channel == 'stable' }}
          files: release-files/*

      # A stable release also records itself in CHANGELOG.md and version.properties on main. A push made with the
      # workflow's own token does not start another run, and the commit is a chore, which never releases.
      - name: Update CHANGELOG.md and version.properties on main
        if: needs.version.outputs.channel == 'stable'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/release/release.py changelog --version "${{ needs.version.outputs.base }}" --notes notes.md
          printf 'version=%s\n' "${{ needs.version.outputs.base }}" > version.properties
          git add CHANGELOG.md version.properties
          git commit -m "chore(release): v${{ needs.version.outputs.base }}"
          git push origin HEAD:main
